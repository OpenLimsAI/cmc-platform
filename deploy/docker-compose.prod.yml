name: cmab-mdm-prod

# 生产部署清单（P4.B-5）
# 适用场景：私有 VM / Docker 主机；通过 nginx 反代 + HTTPS 终止统一入口
#
# 启动：cp .env.prod.example .env.prod && vim .env.prod  # 填密码 / 证书路径
#       docker compose -f docker-compose.prod.yml --env-file ../.env.prod up -d
# 升级：docker compose -f docker-compose.prod.yml --env-file ../.env.prod up -d --build
#
# 注意：
#   - 任何 _CHANGE_ME 占位符必须替换；生产部署前由 IT 走密码管理流程
#   - SECRET_KEY 至少 32 字符；建议 `openssl rand -base64 48`
#   - HTTPS 证书走 nginx 容器挂载 /etc/nginx/certs/

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: cmab-mdm-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_DBA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DBA_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # 备份目录挂出，便于 host crond 跑 backup_db.sh
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=1GB
      -c max_connections=200
      -c log_destination=stderr
      -c log_min_duration_statement=500
      -c log_connections=on
      -c log_disconnections=on
      -c timezone=UTC

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: cmab-mdm-redis
    restart: always
    volumes:
      - redis_data:/data
    networks: [internal]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== Backend ====================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: cmab-mdm-backend
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_FORMAT: json  # ELK/Splunk 直接抓 stderr 转 JSON
      SECRET_KEY: ${SECRET_KEY}
      # JWT（ARCH2）：生产默认 RS256；密钥由下方 ./jwt 只读挂载到 /app/secrets 提供。
      # 缺密钥时 backend 启动 fail-fast（jwt_keys.py 校验），不会静默退回 HS256。
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/secrets/jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/secrets/jwt_public.pem}
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS}
      # 限流生产档：未认证 10/min/IP，普通用户 300/min/user（is_production 自动严守）
      RATE_LIMIT_ENABLED: "true"
      # 容器内时区
      TZ: UTC
    volumes:
      # RS256 密钥只读挂载（host: deploy/jwt → 容器: /app/secrets）。
      # 路径相对 compose 文件所在的 deploy/ 目录；私钥 600，*.pem 已 gitignore。
      - ./jwt:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==================== Frontend (静态 + 内层 nginx) ====================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: cmab-mdm-frontend
    restart: always
    networks: [internal]
    depends_on:
      - backend

  # ==================== Gateway nginx（HTTPS 终止 + 反代 + 限流兜底） ====================
  gateway:
    image: nginx:1.25-alpine
    container_name: cmab-mdm-gateway
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks: [internal]
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: cmab-mdm-postgres-data
  redis_data:
    name: cmab-mdm-redis-data
  nginx_logs:
    name: cmab-mdm-nginx-logs
