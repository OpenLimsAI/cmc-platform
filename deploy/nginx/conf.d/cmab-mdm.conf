# CMAB MDM Portal 站点配置（P4.B-5）
# include 自 nginx.prod.conf

# HTTP → HTTPS 强跳
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2 default_server;
    server_name _;

    # 证书（部署前替换）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 设置（OWASP Intermediate 2025 兼容）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # 限流：全站基础
    limit_req zone=general burst=100 nodelay;

    # ============== /api/v1/auth/login —— 暴破防护 ==============
    location = /api/v1/auth/login {
        # 5r/m + burst=2 — backend slowapi 第 2 层（10/min/IP 生产档）
        limit_req zone=login burst=2 nodelay;

        proxy_pass http://backend:8000/api/v1/auth/login;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ============== /api/ —— 后端反代 ==============
    location /api/ {
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # 健康检查（独立路径，给负载均衡探活；不限流）
    location = /health {
        access_log off;
        proxy_pass http://backend:8000/health;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ============== /metrics —— 限内网 ==============
    # 仅允许从私有网段拉取，公网拒绝
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        access_log off;
        proxy_pass http://backend:8000/metrics;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ============== 前端静态资源 + SPA fallback ==============
    location / {
        proxy_pass http://frontend:80/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
