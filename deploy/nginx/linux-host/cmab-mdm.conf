# Linux 主机 nginx（172.19.0.105）/etc/nginx/conf.d/cmab-mdm.conf 的受管副本
# 部署：sudo cp deploy/nginx/linux-host/cmab-mdm.conf /etc/nginx/conf.d/cmab-mdm.conf && sudo nginx -t && sudo systemctl reload nginx
#
# 2026-08-17：前端挂到统一门户 cmab-hub 的 /mdm/ 子路径下（vite base:'/mdm/'），
# HUB nginx(5100) 把 /mdm/ 原样转到本机 15173、把 /mdm/api/ 剥前缀转到 18000。
# 本文件相应把静态包按 /mdm/ 伺服；/api/ 保留给直连 15173 的老入口。
server {
    listen 15173 default_server;
    server_name _;

    root /opt/cmab-mdm-platform/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://127.0.0.1:18000/health; }
    # 直连 15173（不经 HUB）时前端调的是 /mdm/api/...：这里也剥前缀转后端，老网址照样能用
    location /mdm/api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端：按 /mdm/ 前缀伺服；裸根路径跳过去
    location = / { return 302 /mdm/; }
    location /mdm/ {
        alias /opt/cmab-mdm-platform/frontend/dist/;
        try_files $uri $uri/ /mdm/index.html;
    }
}
