# QAP 前端只在 Linux 本机 5140 提供；外部统一从 cmab-hub:5100/qap/ 进入。
server {
    listen 127.0.0.1:5140;
    server_name _;
    root /opt/cmc-quality-analytics-platform/frontend/dist;
    index index.html;

    client_max_body_size 12m;

    location = / { return 302 /qap/; }
    location = /qap/health { proxy_pass http://127.0.0.1:8040/health; }
    location /qap/api/ {
        proxy_pass http://127.0.0.1:8040/api/;
        proxy_read_timeout 120s;
    }
    location /qap/assets/ {
        alias /opt/cmc-quality-analytics-platform/frontend/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /qap/ {
        alias /opt/cmc-quality-analytics-platform/frontend/dist/;
        try_files $uri $uri/ /qap/index.html;
        add_header Cache-Control "no-cache";
    }
}
