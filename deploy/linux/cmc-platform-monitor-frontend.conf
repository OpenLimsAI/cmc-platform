server {
    listen 127.0.0.1:5125;
    server_name localhost;
    location = /ops { return 301 /ops/; }
    location /ops/assets/ {
        alias /opt/cmc-platform-monitor/frontend/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /ops/ {
        alias /opt/cmc-platform-monitor/frontend/dist/;
        try_files $uri $uri/ /ops/index.html;
        add_header Cache-Control "no-cache";
    }
}
