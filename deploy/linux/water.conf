server {
    listen 127.0.0.1:5115;
    server_name localhost;
    location /water/assets/ {
        alias /opt/cmc-water-system-dashboard/frontend/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /water/ {
        alias /opt/cmc-water-system-dashboard/frontend/dist/;
        try_files $uri $uri/ /water/index.html;
        add_header Cache-Control "no-cache";
    }
}
