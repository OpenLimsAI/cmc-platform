[project]
name = "cmc-platform-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "pydantic-settings>=2,<3", "PyJWT[crypto]>=2.9,<3"]
[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
