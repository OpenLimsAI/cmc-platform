# Linux 主机 nginx（172.19.0.105）/etc/nginx/conf.d/cmab-mdm.conf 的受管副本
# 部署：sudo cp deploy/nginx/linux-host/cmab-mdm.conf /etc/nginx/conf.d/cmab-mdm.conf && sudo nginx -t && sudo systemctl reload nginx
#
# 2026-08-17：前端挂到统一门户 cmab-hub 的 /mdm/ 子路径下（vite base:'/mdm/'），
# HUB nginx(5100) 把 /mdm/ 原样转到本机 15173、把 /mdm/api/ 剥前缀转到 18000。
# 本文件相应把静态包按 /mdm/ 伺服；/api/ 保留给直连 15173 的老入口。
#
# 2026-09-10 缓存策略（修「部署后从门户点进来白页」）：
#   - index.html 之前没带任何 Cache-Control，浏览器按启发式缓存了旧首页；部署后 vite 产物
#     换了哈希文件名，旧首页去要旧名字的页面脚本 → 服务器没有 → try_files 回落成 HTML →
#     "Failed to fetch dynamically imported module" 白页，必须硬刷新。
#   - 现在：index.html 等入口文件 no-cache（每次向服务器校验，有 ETag 所以只走 304）；
#     assets/ 下带哈希的文件一年长缓存 + immutable；assets/ 找不到的文件老老实实 404，
#     不再回落成 index.html（前端 ErrorBoundary 据此自动刷新一次）。
server {
    listen 127.0.0.1:15173 default_server;   # 只听本机：对外统一走 cmab-hub 5100（2026-08-17 起；与 cmab-hub/deploy/linux/10_mdm.sh 一致）
    server_name _;

    root /opt/cmab-mdm-platform/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass http://127.0.0.1:18000/health; }
    # 直连 15173（不经 HUB）时前端调的是 /mdm/api/...：这里也剥前缀转后端，老网址照样能用
    location /mdm/api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端：按 /mdm/ 前缀伺服；裸根路径跳过去
    location = / { return 302 /mdm/; }

    # assets 同时是业务页面前缀；只将构建文件扩展名视为静态资源。
    # 使用 server 的 root 查找去除 /mdm 后的文件；缺文件仍 404，不回落成 HTML。
    location ~ ^/mdm/assets/[^/]+\.(?:js|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
        rewrite ^/mdm/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 index.html 与其他非哈希文件：每次校验（no-cache ≠ 不缓存，是「用前先问服务器」）
    location /mdm/ {
        alias /opt/cmab-mdm-platform/frontend/dist/;
        try_files $uri $uri/ /mdm/index.html;
        add_header Cache-Control "no-cache";
    }
}
