# CMAB MDM Portal - 生产 nginx 反代主配置（P4.B-5）
#
# 入口策略：
#   - HTTP 80 强跳 HTTPS 443
#   - HTTPS 443 → 静态前端（/）+ /api/* 反代后端 + /health 透传后端
#   - /metrics 限内网（监控系统）；其它任何路径 404
# 限流：nginx 层兜底（与 backend slowapi 双层）
#   - 全局：50r/s burst=100 nodelay
#   - /api/v1/auth/login：5r/m burst=2 — 防暴破
#
# HTTPS 证书：deploy/nginx/certs/{fullchain.pem, privkey.pem}
# 上游：frontend:80（容器内 nginx serve dist），backend:8000

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON 访问日志 — 便于 ELK/Splunk 抓取，含 request_id / latency / user-agent
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$http_x_request_id",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"duration_ms":$request_time'
        '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 20m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # ============== 限流（与 backend slowapi 双层兜底） ==============
    # 普通流量：50 req/s/IP，突发 100；超出 503
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=50r/s;
    # 登录端点：每分钟 5 次/IP，防暴破
    limit_req_zone  $binary_remote_addr  zone=login:10m    rate=5r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
