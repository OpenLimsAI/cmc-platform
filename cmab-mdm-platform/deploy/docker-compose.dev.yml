name: cmab-mdm-dev

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: cmab-mdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmab_mdm}
      POSTGRES_USER: ${POSTGRES_DBA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DBA_PASSWORD:-__REDACTED_POSTGRES_DBA_PASSWORD__}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${HOST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=512MB
      -c max_connections=100
      -c log_destination=stderr
      -c log_min_duration_statement=1000
      -c timezone=UTC

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: cmab-mdm-redis
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== Backend ====================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: cmab-mdm-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-__REDACTED_SECRET_KEY__}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cmab_app}:${POSTGRES_PASSWORD:-__REDACTED_POSTGRES_PASSWORD__}@postgres:5432/${POSTGRES_DB:-cmab_mdm}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-cmab_app}:${POSTGRES_PASSWORD:-__REDACTED_POSTGRES_PASSWORD__}@postgres:5432/${POSTGRES_DB:-cmab_mdm}
      REDIS_URL: redis://redis:6379/0
      PM_PUBLIC_URL: ${PM_PUBLIC_URL:-}
      PM_REFERENCE_API_URL: ${PM_REFERENCE_API_URL:-}
      PM_REFERENCE_ACCESS_TOKEN: ${PM_REFERENCE_ACCESS_TOKEN:-}
      MDM_OIDC_ENABLED: ${MDM_OIDC_ENABLED:-false}
      MDM_NATIVE_LOGIN_ENABLED: ${MDM_NATIVE_LOGIN_ENABLED:-true}
      MDM_PUBLIC_URL: ${MDM_PUBLIC_URL:-}
      MDM_OIDC_ISSUER_URL: ${MDM_OIDC_ISSUER_URL:-}
      MDM_OIDC_INTERNAL_URL: ${MDM_OIDC_INTERNAL_URL:-}
      MDM_OIDC_CLIENT_ID: ${MDM_OIDC_CLIENT_ID:-}
      MDM_OIDC_CLIENT_SECRET: ${MDM_OIDC_CLIENT_SECRET:-}
      MDM_OIDC_PM_CLIENT_ID: ${MDM_OIDC_PM_CLIENT_ID:-}
      MDM_OIDC_PM_CLIENT_SECRET: ${MDM_OIDC_PM_CLIENT_SECRET:-}
      MDM_PM_API_URL: ${MDM_PM_API_URL:-}
      MDM_PM_SOURCE_ID: ${MDM_PM_SOURCE_ID:-mdm}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      POSTGRES_DBA_USER: ${POSTGRES_DBA_USER:-postgres}
      POSTGRES_DBA_PASSWORD: ${POSTGRES_DBA_PASSWORD:-__REDACTED_POSTGRES_DBA_PASSWORD__}
      POSTGRES_DB: ${POSTGRES_DB:-cmab_mdm}
      POSTGRES_USER: ${POSTGRES_USER:-cmab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-__REDACTED_POSTGRES_PASSWORD__}
    ports:
      - "${HOST_BACKEND_PORT:-18000}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ==================== Frontend ====================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: cmab-mdm-frontend
    restart: unless-stopped
    environment:
      # 容器内 vite proxy 通过 docker 服务名访问后端
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8000}
      VITE_APP_TITLE: ${APP_NAME:-CMAB MDM Portal}
    ports:
      - "${HOST_FRONTEND_PORT:-15173}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0

volumes:
  postgres_data:
    name: cmab-mdm-postgres-data
  redis_data:
    name: cmab-mdm-redis-data
