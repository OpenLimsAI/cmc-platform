events {}
http {
 include /etc/nginx/mime.types;
 log_format acceptance '$time_iso8601 $request_method $uri $status $upstream_status';
 access_log /var/log/nginx/access.log acceptance; error_log /dev/stderr error;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto http;
 proxy_set_header X-Forwarded-Host $http_host;
 server { listen 8081; location / {proxy_pass http://signing-idp:8000;} }
 server { listen 9091; root /web/pm;
  location = /health {proxy_pass http://signing-backend:8001/health;}
  location /api/ {proxy_pass http://signing-backend:8001;}
  location / {try_files $uri $uri/ /index.html; add_header Cache-Control no-store;}
 }
 server { listen 9092; root /web/portal;
  location = /launch/pm {return 302 http://localhost:19091/;}
  location /api/ {proxy_pass http://signing-backend:8001;}
  location / {try_files $uri $uri/ /index.html; add_header Cache-Control no-store;}
 }
 server { listen 9090; root /web;
  location = / {return 302 /mdm/;}
  location /mdm/api/ {proxy_pass http://signing-backend:8000/api/;}
  location /mdm/ {try_files $uri $uri/ /mdm/index.html; add_header Referrer-Policy no-referrer; add_header Cache-Control no-store;}
 }
}
