[alembic]
# 只管理 app_fastapi schema（不动现有数据仓库的三层 schema）
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://lims_reader:dev_lims_2026@localhost:5432/cmc_data_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
