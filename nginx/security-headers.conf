# ═══════════════════════════════════════════════════════════════════════════
#  门户安全响应头（2026-09-11）—— Mac / Linux 共用一份，由 cmab-hub.*.conf include。
#
#  ⚠️ nginx 的规矩：一个 location 里只要自己写了 add_header，上层的 add_header 就**全部失效**。
#     所以凡是自己加了 Cache-Control 的 location，都要再 include 一次本文件。
#
#  这里只放**不会弄坏页面**的几条：不限制脚本来源（各子系统有内联脚本/样式，收紧会白屏），
#  只挡「被别人套在框架里」「浏览器猜文件类型」「地址泄漏给外站」这几类。
# ═══════════════════════════════════════════════════════════════════════════

# 不许别的站点把本门户套进 iframe（点击劫持）。子系统都在同源 5100 下，自家互相嵌不受影响。
add_header X-Frame-Options              "SAMEORIGIN" always;
add_header Content-Security-Policy      "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
# 浏览器别自作聪明猜文件类型（把上传的文件当脚本执行这类）
add_header X-Content-Type-Options       "nosniff" always;
# 跳到外部网站时不带上本站完整地址
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
# 页面用不到的硬件权限一律关掉
add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
