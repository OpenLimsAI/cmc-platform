# ═══════════════════════════════════════════════════════════════════════════
#  CMAB HUB · 子系统路由表（设计方案 §4）——Mac / Linux 共用，两边子系统端口一致
#
#  约定（每个子系统两条 location，长前缀 /xxx/api/ 优先于 /xxx/）：
#   1) /xxx/api/  → 该系统后端 :80N0/api/     HUB 剥掉 /xxx 前缀；后端路由仍是 /api/v1/...，零改动
#                    并把后端 Set-Cookie 的 Path=/api/... 改写成 /xxx/api/...（MDM refresh cookie 需要）
#   2) /xxx/      → 该系统前端 :51N0
#        · Vite 项目：HUB 剥前缀（proxy_pass 末尾带 /）。前端只需 base:'/xxx/' + basename + api 相对路径，
#          子系统自己的 nginx / vite 配置一律不用动。
#        · Next 项目：HUB 不剥前缀（proxy_pass 末尾不带 /），Next 自己配 basePath:'/xxx' 认前缀；
#          另加一条 location = /xxx 接住 Next 去掉尾斜杠的 308 跳转。
#
#  代理公共参数（头、WebSocket、超时）写在 server 层（cmab-hub.*.conf），nginx 自动继承到这里每个 location。
#  上游一律写 localhost（不写 127.0.0.1）：Mac 上 Vite dev server 只听 IPv6 ::1，nginx 对 localhost 会 v4/v6 都试。
#  加一个系统 = 抄一组两条 location 改端口，再到 frontend/src/config/apps.ts 加一条图标。
# ═══════════════════════════════════════════════════════════════════════════

# ── MDM 主数据（Docker：前端 15173 / 后端 18000）─────────────────────────
location /mdm/api/ {
    proxy_pass http://localhost:18000/api/;
    proxy_cookie_path /api/ /mdm/api/;
}
location /mdm/ {
    proxy_pass http://localhost:15173/;
    proxy_redirect / /mdm/;
}

# ── LabOps 实验室运营（后端 8010 / 前端 5110，Vite）───────────────────────
location /labops/api/ {
    proxy_pass http://localhost:8010/api/;
    proxy_cookie_path /api/ /labops/api/;
}
location /labops/ {
    proxy_pass http://localhost:5110/;
    proxy_redirect / /labops/;
}

# ── 批号管理 rd-batch-registry（后端 8080 / 前端 5180，Vite）──────────────
location /batch/api/ {
    proxy_pass http://localhost:8080/api/;
    proxy_cookie_path /api/ /batch/api/;
}
location /batch/ {
    proxy_pass http://localhost:5180/;
    proxy_redirect / /batch/;
}

# ── 上游工艺看板 cmc-rd-usp-dashboard（后端 8070 / 前端 5170，Next）────────
location /usp/api/ {
    proxy_pass http://localhost:8070/api/;
    proxy_cookie_path /api/ /usp/api/;
}
location /usp/ {
    proxy_pass http://localhost:5170;   # Next：不剥前缀，靠 basePath:'/usp'
}
location = /usp {                       # Next 会把 /usp/ 308 跳成 /usp（不带斜杠），也得接住
    proxy_pass http://localhost:5170;
}

# ── LIMS 看板 cmc-rd-lims-dashboard（后端 8030 / 前端 5130，Next）──────────
location /lims/api/ {
    proxy_pass http://localhost:8030/api/;
    proxy_cookie_path /api/ /lims/api/;
}
location /lims/ {
    proxy_pass http://localhost:5130;   # Next：不剥前缀，靠 basePath:'/lims'
}
location = /lims {                       # Next 会把 /lims/ 308 跳成 /lims（不带斜杠），也得接住
    proxy_pass http://localhost:5130;
}

# ── 成本模型 cmc-cost-modeler（后端 8020 / 前端 5120，Vite）────────────────
location /cost/api/ {
    proxy_pass http://localhost:8020/api/;
    proxy_cookie_path /api/ /cost/api/;
}
location /cost/ {
    proxy_pass http://localhost:5120/;
    proxy_redirect / /cost/;
}
