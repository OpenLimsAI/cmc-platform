# ═══════════════════════════════════════════════════════════════════════════
#  CMAB HUB · 统一门户 nginx 入口（Linux 正式：本文件软链到 /etc/nginx/conf.d/cmab-hub.conf）
#  只监听 5100 —— 全公司唯一对外门；子系统端口全部藏在后面。安装步骤见 nginx/README.md
# ═══════════════════════════════════════════════════════════════════════════

# WebSocket / Vite HMR：有 Upgrade 头就升级，没有就照常
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 一级子路径前缀（/mdm、/labops…）透传给后端，后端需要拼绝对地址时可用
map $request_uri $hub_prefix {
    default              '';
    ~^(?<p>/[a-z0-9_-]+)/ $p;
}

server {
    listen 5100;
    server_name _;

    # ── 门户自身：静态产物（frontend/ 里 pnpm build 生成）──────────────────
    root  /opt/cmab-hub/frontend/dist;
    index index.html;

    # 大文件上传（子系统有 Excel 导入）
    client_max_body_size 50m;

    # ── 反代公共参数：写在 server 层，自动继承到下面所有 location ──────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix $hub_prefix;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── 子系统路由表（Mac / Linux 共用一份）───────────────────────────────
    include /opt/cmab-hub/nginx/hub-locations.conf;

    # ── 门户自身静态产物缓存策略（2026-09-10，与各子系统一致）────────────────
    #   index.html 等入口 no-cache（每次向服务器校验，ETag 304）；assets/ 带哈希文件一年 immutable；
    #   assets/ 缺文件 404 不回落成 HTML。否则部署后浏览器拿旧 index.html 去要旧哈希脚本会失败。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 门户 SPA：其余路径回落到 index.html（React Router）─────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
