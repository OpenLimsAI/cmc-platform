# ═══════════════════════════════════════════════════════════════════════════
#  传输压缩（2026-09-11）—— Mac / Linux 共用一份，由 cmab-hub.*.conf 在 server 层 include。
#
#  为什么写在仓库里：压缩开关本来在每台机器自己的 nginx 主配置（/etc/nginx/nginx.conf、
#  brew 的 nginx.conf）里，那个文件不进 git，两台机器各是各的。实测 Mac 上是关的，
#  Linux 发行版自带的通常是「半开」——只压网页文件，脚本 / 样式 / 接口 JSON 都不压，
#  而且转发给子系统的响应默认完全不压（gzip_proxied 默认 off）。写在这里 = 哪台机器都一样。
#
#  实测收益（门户主脚本 662 KB、验证部平台一次计算返回 1.2 MB）：
#    门户主脚本 662 KB → 约 218 KB；验证部平台结果 1.2 MB → 约 144 KB（省约 88%）。
#
#  没上 Brotli：效果更好但要额外装 nginx 模块，服务器上没有。以后装了再加。
# ═══════════════════════════════════════════════════════════════════════════

gzip on;

# 关键一条：门户是反向代理，绝大多数响应来自子系统。默认 off 会让这些响应完全不压。
gzip_proxied any;

# 压缩级别 5：再往上省不了多少，CPU 却明显变贵（1-9，默认 1）。
gzip_comp_level 5;

# 太小的响应压了反而更大（还多一次 CPU），1 KB 以下不压。
gzip_min_length 1024;

# 让缓存（浏览器 / 中间代理）区分压缩版和未压缩版，别把压缩内容发给不支持的客户端。
gzip_vary on;

# text/html 只要 gzip on 就一定会压，不用也不能写在这里。
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml;
