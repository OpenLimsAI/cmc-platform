# Alembic configuration — 多库（multi-env）。
# 用法: alembic -n <库名> <命令>，例: alembic -n cmc_rd upgrade head
# 连接由 alembic/env.py 据 section 名从 .env 拼出（不在此硬编码）。
# cmab_mdm 不在此（由 cmab-mdm-platform app 自管）。

# 默认段：仅放共享设置。直接 `alembic`（不带 -n）会被 env.py 拒绝。
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# ===== 4 个库各自的环境（共享 alembic/env.py，独立 versions 目录与版本表）=====
[cmc_rd]
script_location = alembic
version_locations = %(here)s/alembic/versions/cmc_rd

[cmc_analytics]
script_location = alembic
version_locations = %(here)s/alembic/versions/cmc_analytics

# 培训库：cmc_analytics 的完整副本（rd_pg:5432，批号系统培训环境专用），共用 cmc_analytics 的 versions 目录，
# 正式库升级后同样跑 `dbmig cmc_analytics_training upgrade head` 保持结构一致。见 rd-batch-registry/docs/培训环境.md
[cmc_analytics_training]
script_location = alembic
version_locations = %(here)s/alembic/versions/cmc_analytics

[cmc_data_platform]
script_location = alembic
version_locations = %(here)s/alembic/versions/cmc_data_platform

[cmc_gmp]
script_location = alembic
version_locations = %(here)s/alembic/versions/cmc_gmp

# 验证部平台独立库（gmp_pg:5434，白皮书 D8 / L14，2026-09-10）：validation / mapping / audit / meta
[cmab_qv]
script_location = alembic
version_locations = %(here)s/alembic/versions/cmab_qv

[post_write_hooks]
# (optional) hooks like black/isort could go here later

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
