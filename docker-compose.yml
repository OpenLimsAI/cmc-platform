# =============================================================================
# 文件: docker-compose.yml
# 用途: 部署 backend + frontend,复用宿主机已有的 PostgreSQL
#
# 部署目标:Linux 服务器,PG 直接装在宿主机(systemd 托管,默认监听 127.0.0.1:5432)
#
# 关键架构选择:network_mode: host
#   - 容器与宿主机共享网络命名空间
#   - backend 直接通过 127.0.0.1:5432 连本地 PG —— 不需要改 listen_addresses
#   - 不需要改 pg_hba.conf —— 走的是已有的 host 127.0.0.1/32 规则
#   - 不需要重启 PG
#   - frontend 通过 http://localhost:8000 访问 backend
#   - ports 配置在 host network 模式下被忽略,服务直接绑到宿主机端口
# =============================================================================

services:
  backend:
    build:
      context: ./backend
    container_name: cmc-backend
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: Asia/Shanghai
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cmc-frontend
    network_mode: host
    environment:
      # 前端跑在宿主机网络命名空间里,直接走 localhost 找 backend
      API_BASE_URL: http://localhost:8000
      TZ: Asia/Shanghai
    depends_on:
      - backend
    restart: unless-stopped
