# =============================================================================
# 文件: docker-compose.with-pg.yml
# 用途: 备选方案 — 一并启动 PostgreSQL 16 容器(适合本地调试 / 没有现成 PG 的环境)
# 用法:
#   docker compose -f docker-compose.with-pg.yml up -d --build
# 与默认 docker-compose.yml 互斥,二选一。
# =============================================================================

services:
  postgres:
    image: postgres:16
    container_name: cmc-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: cmc-backend
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cmc-frontend
    environment:
      API_BASE_URL: http://backend:8000
      TZ: Asia/Shanghai
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
