server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 本前端挂在统一门户 cmab-hub 的 /mdm/ 子路径下（vite base:'/mdm/'），静态包也按 /mdm/ 伺服
    location = / { return 302 /mdm/; }
    location /mdm/ {
        alias /usr/share/nginx/html/;
        # SPA 路由：所有未匹配的 URL 回到 index.html
        try_files $uri $uri/ /mdm/index.html;
        # 静态资源缓存（嵌在这里才能继承 alias，写在外层会用 root 找错路径）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # API 反向代理（生产环境通过 nginx 统一入口）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
